[workspace]
resolver = "2"
members = ["crates/*"]

[profile.release]
lto = "thin"
strip = "symbols"

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
kurbo = "0.11"
eframe = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
thiserror = "2"
clipper2 = "0.6"
usvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
base64 = "0.22"
lopdf = "0.39"
ab_glyph = "0.2"
fontdb = "0.23"
