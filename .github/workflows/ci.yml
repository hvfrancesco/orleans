name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev fonts-dejavu-core

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E '(^test .* FAILED|^---- .* stdout ----|panicked|^error:|Killed|signal)' test-output.log || true)
            tail_context="$(tail -n 40 test-output.log | tr '\n' '|' | cut -c1-6000)"
            echo "::error::test tail: $tail_context"
            exit "$status"
          fi
