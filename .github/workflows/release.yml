name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf \
            libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev fonts-dejavu-core

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E '(^test .* FAILED|^---- .* stdout ----|panicked|^error:|Killed|signal)' test-output.log || true)
            tail_context="$(tail -n 40 test-output.log | tr '\n' '|' | cut -c1-6000)"
            echo "::error::test tail: $tail_context"
            exit "$status"
          fi

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            appimage: true
          - os: windows-latest
            name: windows-x86_64
            appimage: false
          - os: macos-15-intel
            name: macos-x86_64
            appimage: false
          - os: macos-latest
            name: macos-arm64
            appimage: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf \
            libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev fonts-dejavu-core

      - name: Install Linux packaging tools
        if: matrix.appimage
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 3 \
            -o "$HOME/.local/bin/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fL --retry 3 \
            -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and package
        shell: bash
        run: |
          python scripts/package-portable.py
          if [[ "${{ matrix.appimage }}" == "true" ]]; then
            ./scripts/package-appimage.sh
          fi

      - name: Smoke test packaged binary
        shell: bash
        run: |
          python scripts/smoke-release.py
          if [[ "${{ matrix.appimage }}" == "true" ]]; then
            ./dist/*.AppImage --version
            ./dist/*.AppImage run examples/coaster.svg --mock --driver marlin
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orleans-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: orleans ${{ github.ref_name }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*
            CHANGELOG.md
