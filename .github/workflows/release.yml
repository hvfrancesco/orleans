name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf \
            libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E '^(test .* FAILED|---- .* stdout ----|thread .* panicked)' test-output.log || true)
            exit "$status"
          fi

      - name: Install packaging tools
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 3 \
            -o "$HOME/.local/bin/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fL --retry 3 \
            -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build release artifacts
        run: |
          ./scripts/package-release.sh
          ./scripts/package-appimage.sh

      - name: Smoke test release artifacts
        run: |
          ./dist/*.AppImage --version
          ./dist/*.AppImage run examples/coaster.svg --mock

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orleans-${{ github.ref_name }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: orleans ${{ github.ref_name }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            CHANGELOG.md
